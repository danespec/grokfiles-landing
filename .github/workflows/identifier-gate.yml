name: Identifier publication gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  identifier-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify internal links and promoted slug targets
        run: python3 tests/test_identifier_link_gate_20261027.py
      - name: Verify dossier routing, sitemaps and metadata
        run: node tests/test_identifier_release_20261027.mjs
      - name: Verify wiki host and receipt contracts
        run: node tests/test_identifier_wiki_20261027.mjs
      - name: Verify full reader quality regression gates
        run: node tests/test_reader_quality_20261027.mjs
      - name: Verify source PDF bytes, route coverage and editorial metadata
        run: node tests/test_source_pdf_release_20261027.mjs
      - name: Verify hub metadata, source links and primary MCC policy
        run: node tests/test_hub_metadata_polish_20261027.mjs
      - name: Verify all evidence asset identities and acknowledged reader APIs
        run: node tests/test_asset_identity_20261028.mjs
      - name: Verify consolidation policy, canonical homes and receipt twins
        run: node tests/test_publication_policy_20261028.mjs
      - name: Verify Story Atlas v3.8
        run: node tests/test_story_atlas_v382.mjs

      - name: Verify minimized Atlas agent catalog and secure discovery
        run: |
          python3 scripts/build_agent_atlas_catalog.py --check
          node scripts/build_prepared_atlas.mjs --check
          node scripts/build_bundled_atlas.mjs --check
          node tests/test_prepared_atlas.mjs
          node tests/test_ai_future_001.mjs
          node tests/test_atlas_citation_graph.mjs
          node tests/test_analytics_single_pass.mjs
          python3 -m unittest discover -s workers/gah-intel/test -p test_reconcile_timezone.py
          node tests/test_ai_future_004_limits.mjs
          python3 tests/test_atlas_publication_pipeline.py
          node tests/test_staging_harden.mjs
          node tests/test_ai_discovery_005.mjs

name: Identifier publication gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  identifier-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build ephemeral private passage input
        run: |
          export GAH_PRIVATE_PASSAGE_INDEX="$RUNNER_TEMP/editorial-passages-012.mjs"
          python3 scripts/build_editorial_passages_012.py --output "$GAH_PRIVATE_PASSAGE_INDEX"
          echo "GAH_PRIVATE_PASSAGE_INDEX=$GAH_PRIVATE_PASSAGE_INDEX" >> "$GITHUB_ENV"
          test -z "$(git ls-files content/editorial-passages-012.mjs)"
      - name: Verify internal links and promoted slug targets
        run: python3 tests/test_identifier_link_gate_20261027.py
      - name: Verify dossier routing, sitemaps and metadata
        run: node tests/test_identifier_release_20261027.mjs
      - name: Verify wiki host and receipt contracts
        run: node tests/test_identifier_wiki_20261027.mjs
      - name: Verify full reader quality regression gates
        run: node tests/test_reader_quality_20261027.mjs
      - name: Verify source PDF bytes, route coverage and editorial metadata
        run: node tests/test_source_pdf_release_20261027.mjs
      - name: Verify hub metadata, source links and primary MCC policy
        run: node tests/test_hub_metadata_polish_20261027.mjs
      - name: Verify all evidence asset identities and acknowledged reader APIs
        run: node tests/test_asset_identity_20261028.mjs
      - name: Verify consolidation policy, canonical homes and receipt twins
        run: node tests/test_publication_policy_20261028.mjs
      - name: Verify Story Atlas v3.8
        run: node tests/test_story_atlas_v382.mjs

      - name: Verify minimized Atlas agent catalog and secure discovery
        run: |
          python3 scripts/build_agent_atlas_catalog.py --check
          node scripts/build_prepared_atlas.mjs --check
          node scripts/build_bundled_atlas.mjs --check
          node tests/test_prepared_atlas.mjs
          node tests/test_ai_future_001.mjs
          node tests/test_atlas_citation_graph.mjs
          node tests/test_analytics_single_pass.mjs
          node tests/test_web_bot_auth_017.mjs
          python3 -m unittest discover -s workers/gah-intel/test -p test_reconcile_timezone.py
          node tests/test_ai_future_004_limits.mjs
          python3 tests/test_atlas_publication_pipeline.py
          node tests/test_staging_harden.mjs
          node tests/test_ai_discovery_005.mjs
      - name: Staging research preview publication and security gate
        run: node tests/test_research_preview.mjs
      - name: Intent routing and exact retrieval invariants
        run: node tests/test_retrieval_routing_007.mjs
      - name: Publication fingerprint and human-judgment guard
        run: python3 tests/test_retrieval_source_integrity_007.py
      - name: Bounded production retrieval release gate
        run: node tests/test_retrieval_release_008.mjs
      - name: Reviewed editorial ranking and full archive preservation gate
        run: node tests/test_editorial_ranking_009.mjs

      - name: Publication corpus freshness, public research and isolation gates
        run: |
          deploy/prepare-publication-release.sh --check
          node tests/test_research_010.mjs

      - name: Private telemetry schema, authentication and aggregate query contracts
        working-directory: workers/gah-intel
        run: |
          npm ci --ignore-scripts
          node --test test/intel.test.mjs test/reviews.test.mjs
      - name: Frozen benchmark and independent-review guard
        run: python3 tests/test_research_review_guard_010.py
      - name: Source-bound title enrichment and indexing preservation
        run: node tests/test_seo_title_enrichment_20261114.mjs
      - name: Sitewide search discovery and publication boundaries
        run: node tests/test_seo_sitewide_20261116.mjs
      - name: All twelve source-linked dataset guides and discovery contracts
        run: node tests/test_dataset_guides_20261117.mjs

      - name: Research citation packet and intent guard
        run: node tests/test_research_evidence_closeout.mjs
      - name: Filtered editorial passage search candidate
        run: |
          python3 tests/test_editorial_passages_012.py
          python3 tests/test_private_build_012.py
          node --experimental-loader ./scripts/private_passage_loader_012.mjs tests/test_editorial_search_012.mjs
      - name: Private hybrid and source-bound extraction contracts
        run: |
          node --experimental-loader ./scripts/private_passage_loader_012.mjs tests/test_neural_hybrid_013.mjs
          node tests/test_answers_015.mjs
          node --experimental-loader ./scripts/private_passage_loader_012.mjs tests/test_evidence_candidates_015.mjs
          node tests/test_private_neural_service_013.mjs
          python3 tests/test_archive_admission_014.py
          python3 tests/test_archive_fingerprint_reconciliation_014.py
          python3 tests/test_archive_locator_manifest_014.py
          python3 tests/test_archive_source_urls_014.py
          python3 tests/test_archive_source_changes_014.py
          python3 tests/test_archive_vectors_014.py
          python3 tests/test_evidence_review_import_016.py

      - name: Practical retrieval and exact cache contracts
        run: |
          node tests/test_exact_result_cache.mjs
          node tests/test_research_features.mjs
          GAH_CONTRACT_VECTORS="$(mktemp -d)/vectors.mjs"
          python3 scripts/build_editorial_vectors_013.py --output "$GAH_CONTRACT_VECTORS" --contract-fixture
          GAH_PRIVATE_EDITORIAL_VECTORS="$GAH_CONTRACT_VECTORS" node --experimental-loader ./scripts/private_passage_loader_012.mjs tests/test_practical_retrieval.mjs
          GAH_ANSWER_TEST_ROOT=$(mktemp -d)
          node scripts/build_reviewed_answer_bank_015.mjs "$GAH_ANSWER_TEST_ROOT" "$GAH_ANSWER_TEST_ROOT/answers.mjs"
          GAH_PRIVATE_REVIEWED_ANSWERS="$GAH_ANSWER_TEST_ROOT/answers.mjs" node --experimental-loader ./scripts/private_passage_loader_012.mjs tests/test_reviewed_answer_runtime.mjs

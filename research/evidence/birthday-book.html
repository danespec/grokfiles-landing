<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Birthday Book Evidence Reader - Grok Archive Hub</title>
  <meta name="description" content="Mobile-first evidence reader for Birthday Book vision observations, OCR text, document strings, signatures, handwriting candidates, redactions, dates, provenance, and GAPS labels.">
  <meta name="robots" content="noindex, follow">
  <link rel="stylesheet" href="/evidence-engine/v1/evidence-engine.css">
  <script defer src="/evidence-engine/v1/evidence-engine.js"></script>
</head>
<body>
  <main
    id="evidence-engine-root"
    class="ee-app"
    data-dataset-url="/evidence-data/birthday-book/manifest.json"
    data-base-route="/research/evidence/birthday-book"
  >
    <section class="ee-loading" aria-live="polite">
      <p class="ee-kicker">Grok Archive Hub evidence engine</p>
      <h1>Birthday Book evidence reader</h1>
      <p>Loading source-bound page records and GAPS labels.</p>
    </section>
  </main>
  <noscript>This evidence reader requires JavaScript to load page records and filters.</noscript>
</body>
</html>
